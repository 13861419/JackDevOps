name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server & web
        run: |
          pnpm --filter @jackdevops/server build
          pnpm --filter @jackdevops/web build

      - name: Stage server runtime (pnpm deploy)
        run: |
          pnpm --filter @jackdevops/server --prod deploy --legacy .deploy/server
          curl -fsSL https://dl.k8s.io/release/v1.31.3/bin/linux/amd64/kubectl -o .deploy/server/kubectl
          chmod +x .deploy/server/kubectl

      - name: Build images
        run: |
          docker build -f apps/server/Dockerfile.deploy -t jackdevops-server:local .deploy/server
          docker build -f apps/web/Dockerfile -t jackdevops-web:local apps/web

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "server=ghcr.io/${OWNER}/jackdevops-server" >> $GITHUB_OUTPUT
          echo "web=ghcr.io/${OWNER}/jackdevops-web" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "extra=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=edge" >> $GITHUB_OUTPUT
            echo "extra=" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Push server & web images
        run: |
          docker tag jackdevops-server:local ${{ steps.tags.outputs.server }}:${{ steps.tags.outputs.tag }}
          docker tag jackdevops-web:local ${{ steps.tags.outputs.web }}:${{ steps.tags.outputs.tag }}
          docker push ${{ steps.tags.outputs.server }}:${{ steps.tags.outputs.tag }}
          docker push ${{ steps.tags.outputs.web }}:${{ steps.tags.outputs.tag }}
          if [ -n "${{ steps.tags.outputs.extra }}" ]; then
            docker tag jackdevops-server:local ${{ steps.tags.outputs.server }}:latest
            docker tag jackdevops-web:local ${{ steps.tags.outputs.web }}:latest
            docker push ${{ steps.tags.outputs.server }}:latest
            docker push ${{ steps.tags.outputs.web }}:latest
          fi
