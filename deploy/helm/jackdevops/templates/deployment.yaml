apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app: jackdevops-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: jackdevops-server
  template:
    metadata:
      labels:
        app: jackdevops-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: JACK_ADMIN_TOKEN
              value: {{ .Values.env.JACK_ADMIN_TOKEN | quote }}
            {{- if .Values.env.JACK_LLM_BASE_URL }}
            - name: JACK_LLM_BASE_URL
              value: {{ .Values.env.JACK_LLM_BASE_URL | quote }}
            {{- end }}
            {{- if .Values.env.JACK_LLM_API_KEY }}
            - name: JACK_LLM_API_KEY
              value: {{ .Values.env.JACK_LLM_API_KEY | quote }}
            {{- end }}
            {{- if .Values.env.JACK_LLM_MODEL }}
            - name: JACK_LLM_MODEL
              value: {{ .Values.env.JACK_LLM_MODEL | quote }}
            {{- end }}
            {{- if .Values.env.NOTIFY_PROVIDER }}
            - name: NOTIFY_PROVIDER
              value: {{ .Values.env.NOTIFY_PROVIDER | quote }}
            {{- end }}
            {{- if .Values.env.NOTIFY_WEBHOOK_URL }}
            - name: NOTIFY_WEBHOOK_URL
              value: {{ .Values.env.NOTIFY_WEBHOOK_URL | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
