apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jackdevops.name" . }}-secrets
  labels:
    {{- include "jackdevops.labels" . | nindent 4 }}
type: Opaque
stringData:
  JACK_ADMIN_TOKEN: {{ .Values.server.adminToken | quote }}
  {{- if .Values.server.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ .Values.server.deepseekApiKey | quote }}
  {{- end }}
  {{- if .Values.server.githubToken }}
  JACK_GITHUB_TOKEN: {{ .Values.server.githubToken | quote }}
  {{- end }}
  {{- if .Values.server.notifyProvider }}
  NOTIFY_PROVIDER: {{ .Values.server.notifyProvider | quote }}
  NOTIFY_WEBHOOK_URL: {{ .Values.server.notifyWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.server.extraUsers }}
  JACK_USERS: {{ .Values.server.extraUsers | quote }}
  {{- end }}
