replicaCount: 1

image:
  repository: ghcr.io/13861419/jackdevops-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

env:
  DATABASE_URL: postgresql://jackdevops:jackdevops@jackdevops-postgres:5432/jackdevops
  JACK_ADMIN_TOKEN: change-me
  # Optional AI configuration
  JACK_LLM_BASE_URL: ""
  JACK_LLM_API_KEY: ""
  JACK_LLM_MODEL: deepseek-chat
  # Optional IM notifications (slack|dingtalk|feishu|wecom)
  NOTIFY_PROVIDER: ""
  NOTIFY_WEBHOOK_URL: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
