services:
  postgres:
    image: postgres:16-alpine
    container_name: jackdevops-postgres
    environment:
      POSTGRES_USER: jackdevops
      POSTGRES_PASSWORD: jackdevops
      POSTGRES_DB: jackdevops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackdevops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jackdevops-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
